name: Tests

# Vets the code and runs every test, with the race detector, on pushes to
# main and on pull requests. The tests that encode run on Jellyfin's ffmpeg,
# the one the Docker image ships, since Ubuntu's is too old for prerolls, and
# MKVToolNix. GitHub's runners have no GPU, so the tests that need NVENC or
# VAAPI skip themselves, saying why; -v shows which.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Install ffmpeg and MKVToolNix
        run: |
          sudo install -d /etc/apt/keyrings
          curl -fsSL https://repo.jellyfin.org/jellyfin_team.gpg.key | sudo gpg --dearmor -o /etc/apt/keyrings/jellyfin.gpg
          . /etc/os-release
          echo "deb [signed-by=/etc/apt/keyrings/jellyfin.gpg] https://repo.jellyfin.org/ubuntu $VERSION_CODENAME main" \
            | sudo tee /etc/apt/sources.list.d/jellyfin.list
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends jellyfin-ffmpeg8 mkvtoolnix
          sudo ln -sf /usr/lib/jellyfin-ffmpeg/ffmpeg /usr/local/bin/ffmpeg
          sudo ln -sf /usr/lib/jellyfin-ffmpeg/ffprobe /usr/local/bin/ffprobe
          ffmpeg -hide_banner -version | head -n 1
      - run: go vet ./...
      - run: go test -race -count=1 -v ./...
